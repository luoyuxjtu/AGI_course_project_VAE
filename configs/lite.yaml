exp_name: lite              # lightweight model — half the base channels
seed: 42
data_dir: data/coco2017
image_size: 256
batch_size: 32
num_workers: 4

base_channels: 16           # half of the full model (32); reduces params ~4×
bottleneck_dim: 1024

lambda_rec: 100.0
lambda_adv: 1.0
adv_warmup_epochs: 5

mask_min_ratio: 0.25
mask_max_ratio: 0.5

epochs: 100
lr_g: 0.0002
lr_d: 0.0002
beta1: 0.5
use_amp: true

num_vis: 16
compute_fid: false
